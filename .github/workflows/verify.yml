name: verify

# Same checks as the pre-commit hook, for every push and pull request.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + intent tests
        run: npm test
      - name: Browser smoke test (uses the runner's Google Chrome, WebGL via SwiftShader)
        run: npm run smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
